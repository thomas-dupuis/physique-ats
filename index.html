  :root{
    --encre:#1b2a41; --papier:#fbf8ef; --ligne:#d6e2ee; --marge:#e0564a;
    --jaune:#ffd84d; --vert:#2f9e5e; --vert-c:#e3f4e8; --rouge:#d8432f; --rouge-c:#fde7e2; --bleu:#1f6fd1; --orange:#e8590c; --gris:#6b7890;
    --ui:"Avenir Next","Segoe UI","Helvetica Neue",Arial,sans-serif;
    --math:"CMU","Latin Modern Roman","CMU Serif","Times New Roman",Times,serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{background:var(--papier)}
  body{margin:0;min-height:100vh;color:var(--encre);font-family:var(--ui);font-size:16px;line-height:1.35;padding:0;
    background-color:var(--papier);
    background-image:linear-gradient(var(--ligne) 1px,transparent 1px),linear-gradient(90deg,var(--ligne) 1px,transparent 1px);
    background-size:22px 22px}
  .page{max-width:500px;margin:0 auto;min-height:100vh;padding:16px 14px 34px 26px;position:relative}
  .page::before{content:"";position:absolute;left:12px;top:0;bottom:0;width:2px;background:var(--marge);opacity:.75}
  .ecran{display:none}
  .ecran.actif{display:block}
  button{font-family:var(--ui);font-size:1rem;color:var(--encre);cursor:pointer}
  .exo p i{font-family:var(--math);font-style:italic;font-size:1.08em}
  .schema,.enonce,.question,.rep,.expli,.eqn{font-family:var(--math)}
  sub,sup{font-size:.72em;line-height:0}
  .frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .12em;line-height:1.1}
  .frac{font-size:.94em}
  .frac > span:first-child{border-bottom:1px solid currentColor;padding:0 .22em 2px}
  .frac > span:last-child{padding:2px .22em 0}
  .bloc{background:#fff;border:2px solid var(--encre);border-radius:6px;box-shadow:4px 4px 0 var(--encre)}
  .fluo{background:linear-gradient(transparent 55%,var(--jaune) 55%);padding:0 .15em}

  /* ---------- accueil ---------- */
  .tete{margin:6px 0 14px}
  .tete h1{margin:0;font-size:1.9rem;font-weight:800;letter-spacing:-.5px;line-height:1.1}
  .tete p{margin:6px 0 0;font-size:.95rem;color:var(--gris)}
  .tete p b{color:var(--encre)}
  .comp{padding:12px 12px 4px;margin-bottom:18px}
  .comp .entete{display:flex;align-items:baseline;gap:10px;border-bottom:2px solid var(--encre);padding-bottom:8px}
  .comp .code{font-weight:800;font-size:.85rem;border:2px solid var(--encre);border-radius:4px;padding:1px 7px;background:var(--jaune)}
  .comp h2{margin:0;font-size:1.12rem;font-weight:800}
  .exo{padding:12px 0 12px;border-bottom:1px dashed #9aa7b8}
  .exo:last-child{border-bottom:none}
  .exo .ligne{display:flex;align-items:baseline;gap:8px}
  .exo h3{margin:0;font-size:1.02rem;font-weight:800;flex:1}
  .exo .score{font-weight:800;font-size:.9rem;white-space:nowrap}
  .exo p{margin:2px 0 10px;font-size:.86rem;color:var(--gris)}
  .cases{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
  .niv{aspect-ratio:1;max-height:62px;width:100%;background:#fff;border:2px solid var(--encre);border-radius:6px;font-weight:800;font-size:1.25rem;padding:0;box-shadow:3px 3px 0 var(--encre);transition:transform .06s,box-shadow .06s;position:relative}
  .niv:not(:disabled):active{transform:translate(3px,3px);box-shadow:0 0 0 var(--encre)}
  .niv.fait{background:var(--vert);color:#fff}
  .niv.fait::after{content:"";position:absolute;right:5px;top:5px;width:9px;height:5px;border-left:2.5px solid #fff;border-bottom:2.5px solid #fff;transform:rotate(-45deg)}
  .niv.suivant{background:var(--jaune)}
  .niv.verrou{color:#a9b3c2;border-color:#a9b3c2;box-shadow:none;cursor:default;background:repeating-linear-gradient(45deg,#fff,#fff 5px,#eef1f5 5px,#eef1f5 10px)}
  .apres{margin:9px 0 0;font-size:.84rem;color:var(--encre)}
  .apres b{font-weight:800}
  .pied{text-align:center}
  .lien{background:none;border:none;color:var(--gris);font-size:.85rem;text-decoration:underline;padding:8px}

  /* ---------- jeu ---------- */
  .haut{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .haut .ferme{width:36px;height:36px;background:#fff;border:2px solid var(--encre);border-radius:6px;font-size:1rem;font-weight:800;flex:none;padding:0}
  .pas{flex:1;display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
  .pas span{height:14px;border:2px solid var(--encre);border-radius:3px;background:#fff}
  .pas span.ok{background:var(--vert)}
  .pas span.ici{background:var(--jaune)}
  .ou{font-size:.84rem;color:var(--gris);margin:0 0 10px}
  .ou b{color:var(--encre)}
  .schema{padding:8px 6px 4px}
  .schema svg{display:block;margin:0 auto;width:100%;height:auto}
  .enonce{font-size:1.08rem;line-height:1.4;margin:14px 0 0;padding-left:10px;border-left:3px solid var(--encre)}
  .question{font-size:1.75rem;font-weight:400;margin:14px 0 12px;display:flex;align-items:center;justify-content:center;gap:.3em;flex-wrap:wrap}
  .question .q{background:linear-gradient(transparent 50%,var(--jaune) 50%);padding:0 .2em}
  .question small{font-size:1rem;color:var(--gris);flex-basis:100%;text-align:center}
  .reponses{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .rep{min-height:70px;background:#fff;border:2px solid var(--encre);border-radius:6px;box-shadow:4px 4px 0 var(--encre);font-size:1.55rem;padding:6px;transition:transform .06s,box-shadow .06s}
  .rep:not(:disabled):active{transform:translate(4px,4px);box-shadow:0 0 0 var(--encre)}
  .rep:disabled{cursor:default;color:var(--encre);opacity:1}
  .rep.juste{background:var(--vert-c);border-color:var(--vert);box-shadow:4px 4px 0 var(--vert)}
  .rep.faux{background:var(--rouge-c);border-color:var(--rouge);box-shadow:4px 4px 0 var(--rouge);animation:secoue .3s}
  .rep.eteint{opacity:.38;box-shadow:none}
  @keyframes secoue{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
  .retourq{display:none;margin-top:18px;overflow:hidden}
  .retourq.vu{display:block}
  .retourq .verdict{font-family:var(--ui);margin:0;padding:7px 12px;font-weight:800;font-size:1.05rem;color:#fff;border-bottom:2px solid var(--encre)}
  .retourq.bon .verdict{background:var(--vert)}
  .retourq.mauvais .verdict{background:var(--rouge)}
  .retourq .expli{font-size:1.05rem;line-height:1.45;margin:0;padding:10px 12px 4px}
  .retourq .action{padding:8px 12px 12px}
  .etape{display:block;margin:0 0 5px}
  .etape.sous{color:var(--gris);font-size:.95rem}
  .etape.res{font-weight:700;margin-top:8px;font-size:1.15rem}
  .legende{display:block;font-family:var(--ui);font-size:.8rem;color:var(--gris);margin-top:6px}
  .legende b{color:var(--bleu)}
  .gros{display:block;width:100%;background:var(--encre);color:#fff;border:2px solid var(--encre);border-radius:6px;padding:13px 10px;font-size:1.05rem;font-weight:800}
  .gros:active{background:#31466a}
  .leger{display:block;width:100%;background:none;border:none;font-weight:700;padding:14px;margin-top:4px;text-decoration:underline}

  /* ---------- fin de niveau ---------- */
  .fin{text-align:center;padding:46px 4px 10px}
  .tampon{display:inline-block;border:4px double var(--vert);color:var(--vert);border-radius:10px;padding:10px 22px;font-weight:800;font-size:1.7rem;letter-spacing:2px;text-transform:uppercase;transform:rotate(-7deg);animation:tamponne .35s cubic-bezier(.3,1.6,.5,1) both}
  .tampon small{display:block;font-size:.8rem;letter-spacing:3px;font-weight:700}
  @keyframes tamponne{from{transform:rotate(-7deg) scale(2.4);opacity:0}}
  .fin h2{margin:34px 0 6px;font-size:1.5rem;font-weight:800}
  .fin p{margin:0 0 24px;color:var(--gris)}

  /* ---------- schéma ---------- */
  .fil{fill:none;stroke:#1b2a41;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .cmp{fill:#fff;stroke:#1b2a41;stroke-width:2.2}
  .txt{font-family:var(--math);font-size:21px;fill:#1b2a41}
  .ask{stroke:#e8590c;fill:#e8590c}
  .txt.ask{stroke:none;font-weight:700}
  .aux{stroke:#1f6fd1;fill:#1f6fd1}
  .txt.aux{stroke:none;font-weight:700}

  /* ---------- équations, vecteurs ---------- */
  .eqn{font-size:1.28rem;white-space:nowrap;overflow-x:auto;text-align:center;padding:16px 4px 14px}
  .vec{position:relative;display:inline-block}
  .vec::after{content:"→";position:absolute;left:0;right:0;top:-.6em;text-align:center;font-size:.75em;line-height:1;font-style:normal}
  .reponses.large{grid-template-columns:1fr}
  .reponses.large .rep{min-height:58px;font-size:1.12rem;line-height:1.5}
  /* ---------- comptes ---------- */
  .compte{align-items:center;justify-content:space-between;gap:8px;font-size:.9rem;margin:0 0 12px}
  .formu{padding:14px}
  .formu h2{margin:0 0 10px;font-size:1.2rem}
  .formu label{display:block;font-size:.88rem;font-weight:700;margin-bottom:10px}
  .formu input{display:block;width:100%;margin-top:4px;padding:11px 10px;font-size:1rem;font-family:var(--ui);border:2px solid var(--encre);border-radius:6px;background:#fff;color:var(--encre)}

<script>
"use strict";
/* =====================================================================
   1. DESCRIPTION DES CIRCUITS
   Grille : x vers la droite, y vers le bas, 1 unité = 100 px.
   Valeurs : E = 1, R = 1 (tensions en unités de E, courants en E/R).
   Tension u d'un dipôle (a,b) : u = V(a) - V(b) (flèche pointant vers a).
   Courant i d'un dipôle (a,b) : orienté de a vers b.
   ===================================================================== */
const V=(a,b)=>({k:'V',id:'E',a,b,v:1});
const R=(id,a,b,v=1)=>({k:'R',id,a,b,v});
const C=(id,a,b)=>({k:'C',id,a,b});
const L=(id,a,b)=>({k:'L',id,a,b});
const K=(a,b)=>({k:'K',a,b});
const S=(c,p1,p2)=>({k:'S',c,p1,p2});
const W=(...p)=>({k:'W',p});
const mk=(d,id,a,b)=> d.k==='R'?R(id,a,b,d.v): d.k==='C'?C(id,a,b):L(id,a,b);
const U=(n,e,d=1)=>({n,e,t:'u',d});
const I=(n,e,d=1)=>({n,e,t:'i',d});
const rC={k:'C'}, rL={k:'L'}, rR=(v=1)=>({k:'R',v});

/* circuit série : source, K, puis R et X (X = C ou L). vr : 1, 2, 'RR', 'XR' */
function serie(X,vr){
  const e=[V([0,1],[0,0]),K([0,0],[1,0])],q=[];
  if(vr==='XR') e.push(mk(X,'X',[1,0],[2,0]),R('R1',[2,0],[2,1]),W([2,1],[0,1]));
  else if(vr==='RR') e.push(R('R1',[1,0],[2,0]),R('R2',[2,0],[3,0]),mk(X,'X',[3,0],[3,1]),W([3,1],[0,1]));
  else e.push(R('R1',[1,0],[2,0],vr),mk(X,'X',[2,0],[2,1]),W([2,1],[0,1]));
  if(X.k==='C') q.push(U('u_C','X'),I('i','R1')); else q.push(I('i','X'),U('u_L','X'));
  if(vr==='RR') q.push(U('u_1','R1'),U('u_2','R2')); else q.push(U('u_R','R1'));
  return {t:'ferme',dech:X.k==='C',e,q};
}
/* RLC série à la fermeture */
function rlc(){
  return {t:'ferme',dech:true,
    e:[V([0,1],[0,0]),K([0,0],[1,0]),R('R1',[1,0],[2,0]),L('L',[2,0],[3,0]),C('C',[3,0],[3,1]),W([3,1],[0,1])],
    q:[U('u_C','C'),I('i','L'),U('u_L','L'),U('u_R','R1')]};
}
/* inverseur : (1) source, (2) fil de retour (avec r2 éventuelle). X = C, L ou 'LC' */
function inv(X,r1=1,r2=0,idir=1,i2=['m']){
  const H=r2?1.4:1, e=[V([0,H],[0,0]),W([0,0],[0.9,0]),S([1.5,0],[0.9,0],[1.2,0.42]),W([1.5,0],[1.8,0]),R('R1',[1.8,0],[2.8,0],r1)],q=[];
  let xr=2.8;
  if(X==='LC'){ e.push(L('L',[2.8,0],[3.8,0]),C('C',[3.8,0],[3.8,H])); xr=3.8;
    q.push(U('u_C','C'),I('i','L'),U('u_L','L'),U('u_R','R1')); }
  else { e.push(mk(X,'X',[2.8,0],[2.8,H]));
    if(X.k==='C') q.push(U('u_C','X'),I('i','R1',idir)); else q.push(I('i','X'),U('u_L','X')); }
  e.push(W([xr,H],[1.2,H],[0,H]));
  if(r2){ e.push(R('R2',[1.2,0.42],[1.2,H],r2)); q.push(U('u_1','R1'),U('u_2','R2')); }
  else { e.push(W([1.2,0.42],[1.2,H])); if(X!=='LC') q.push(U('u_R','R1')); }
  return {t:'bascule',e,q,i2};
}
/* deux mailles : source, K, R1, branche du milieu, (top), branche de droite */
function mailles(t,r1,mid,right,top,i2){
  const e=[V([0,1],[0,0]),K([0,0],[1,0]),R('R1',[1,0],[2,0],r1),mk(mid,'M',[2,0],[2,1]),
    top?mk(top,'T',[2,0],[3.3,0]):W([2,0],[3.3,0]),mk(right,'D',[3.3,0],[3.3,1]),W([3.3,1],[2,1],[0,1])];
  const q=[I('i_1','R1')];
  for(const [d,id] of [[mid,'M'],[right,'D']]){
    if(d.k==='R') q.push(I('i_2',id));
    if(d.k==='C') q.push(U('u_C',id),I('i_C',id));
    if(d.k==='L') q.push(I('i_L',id),U('u_L',id));
  }
  return {t,e,q,i2:i2||(t==='ouvre'?['m']:['inf'])};
}
/* K dans la branche de R2, en parallèle sur un condensateur */
function brancheC(r1,r2){
  return {t:'ferme',i2:['m','inf'],
    e:[V([0,1],[0,0]),R('R1',[0,0],[1,0],r1),C('C',[1,0],[1,1]),K([1,0],[2.3,0]),R('R2',[2.3,0],[2.3,1],r2),W([2.3,1],[1,1],[0,1])],
    q:[U('u_C','C'),I('i_1','R1'),I('i_2','R2'),I('i_C','C')]};
}
/* (K + R2) en parallèle sur R1, puis bobine */
function paraL(t){
  return {t,i2:['m','inf'],
    e:[V([0,1],[0,0]),W([0,0],[0,-0.8]),K([0,-0.8],[1,-0.8]),R('R2',[1,-0.8],[2,-0.8]),W([2,-0.8],[2,0]),
       R('R1',[0,0],[2,0]),L('L',[2,0],[2,1]),W([2,1],[0,1])],
    q:[I('i_L','L'),U('u_L','L'),I('i_1','R1'),I('i_2','R2')]};
}

const NIVEAUX=[
 {nom:'RC et RL série', c:[serie(rC,1),serie(rL,1),serie(rC,2),serie(rL,2),serie(rC,'RR'),serie(rL,'RR'),serie(rC,'XR'),serie(rL,'XR')]},
 {nom:'Décharge', c:[inv(rC,1,0,1),inv(rL,1),inv(rC,2,0,-1),inv(rL,2),inv(rC,1,1),inv(rL,1,1),inv(rL,1,2),inv(rC,1,2,-1)]},
 {nom:'Deux mailles', c:[mailles('ferme',1,rR(),rC),mailles('ferme',1,rR(),rL),mailles('ferme',2,rC,rR()),mailles('ferme',2,rL,rR()),mailles('ferme',1,rR(2),rC),mailles('ferme',1,rR(2),rL)]},
 {nom:'Ouverture et branches', c:[mailles('ouvre',1,rR(),rC),mailles('ouvre',1,rR(),rL),mailles('ouvre',2,rC,rR()),mailles('ouvre',1,rL,rR(2)),brancheC(1,1),paraL('ferme'),paraL('ouvre'),brancheC(1,2)]},
 {nom:'Bobine et condensateur', c:[rlc(),inv('LC'),mailles('ferme',1,rC,rL,rR()),mailles('ouvre',1,rC,rL,rR(2)),mailles('ferme',1,rL,rC,rR()),mailles('ouvre',1,rL,rC,rR(),['m'])]}
];

/* =====================================================================
   1 bis. EL1 — CIRCUITS EN RÉGIME CONTINU
   ===================================================================== */
const P=(a,b)=>({k:'P',id:'AB',a,b,v:1});                     // bornes A (en b) et B (en a) du dipôle
/* deux ou trois résistances en série sur une source : loi d'Ohm, pont diviseur */
function pontSerie(vs){
  const e=[V([0,1],[0,0])];
  if(vs.length===2) e.push(R('R1',[0,0],[1.6,0],vs[0]),R('R2',[1.6,0],[1.6,1],vs[1]),W([1.6,1],[0,1]));
  else e.push(R('R1',[0,0],[1.3,0],vs[0]),R('R2',[1.3,0],[2.6,0],vs[1]),R('R3',[2.6,0],[2.6,1],vs[2]),W([2.6,1],[0,1]));
  return {t:'dc',e,q:[I('i','R1')].concat(vs.map((v,k)=>U('u_'+(k+1),'R'+(k+1))))};
}
/* R1 en série avec (R2 // R3) */
function deuxMailles(v1,v2,v3){
  return {t:'dc',
    e:[V([0,1],[0,0]),R('R1',[0,0],[1.4,0],v1),R('R2',[1.4,0],[1.4,1],v2),W([1.4,0],[2.8,0]),R('R3',[2.8,0],[2.8,1],v3),W([2.8,1],[1.4,1],[0,1])],
    q:[I('i_1','R1'),I('i_2','R2'),I('i_3','R3'),U('u_1','R1'),U('u_2','R2')]};
}
/* circuits numériques : dipôles quelconques D_k (résistance cachée r) ou résistances connues R_k.
   enig : [cible, données...] ; ori : sens des flèches (−1 = inversé) */
function numerique(E,pos,r,ori,enig,res){
  const el=(k,a,b)=> res&&res.includes(k)? Object.assign(R('D'+k,a,b,r[k-1]),{nom:'R_'+k}) : {k:'D',id:'D'+k,a,b,r:r[k-1],nom:'D_'+k};
  const xm=Math.max(...pos.map(p=>p[1][0]));
  const e=[Object.assign(V([0,1],[0,0]),{v:E})].concat(pos.map((p,k)=>el(k+1,p[0],p[1])));
  e.push(W(...[...new Set(pos.filter(p=>p[1][1]===1).map(p=>p[1][0]))].sort((a,b)=>b-a).map(x=>[x,1]),[0,1]));
  const o=n=>(ori&&ori[n])||1, q=[];
  pos.forEach((p,k)=>{ if(p[2]) q.push(I('i_'+p[2],'D'+(k+1),o('i_'+p[2]))); });
  pos.forEach((p,k)=>q.push(U('u_'+(k+1),'D'+(k+1),o('u_'+(k+1)))));
  const c={t:'dc',num:1,e,q};
  c.enig=enig.map(([cible,...d])=>({q:q.find(x=>x.n===cible), don:d.filter(n=>/^[ui]_/.test(n)).map(n=>q.find(x=>x.n===n)),
    dE:d.includes('E'), dR:d.filter(n=>/^R_/.test(n)).map(n=>e.find(x=>x.nom===n))}));
  return c;
}
const T1=[[[0,0],[1.4,0],1],[[1.4,0],[1.4,1],2],[[1.4,0],[2.8,0],3],[[2.8,0],[2.8,1]]];
const T2=[[[0,0],[1.3,0],1],[[1.3,0],[1.3,1],2],[[1.3,0],[2.6,0],3],[[2.6,0],[2.6,1],4],[[2.6,0],[3.9,0],5],[[3.9,0],[3.9,1]]];
const NOEUDS1=[['i_1','i_2','i_3'],['i_2','i_1','i_3'],['i_3','i_1','i_2']];
const NOEUDS2=[['i_1','i_2','i_3'],['i_3','i_4','i_5'],['i_1','i_2','i_4','i_5'],['i_5','i_1','i_2','i_4'],['i_4','i_3','i_5']];
const MAILLES1=[['u_2','E','u_1'],['u_1','E','u_2'],['u_4','u_2','u_3'],['u_2','u_3','u_4'],['u_4','E','u_1','u_3']];
const OHM1=[['u_2','E','R_1','i_1'],['u_3','i_1','i_2','R_3'],['u_4','u_2','R_3','i_3'],['i_1','E','u_2','R_1'],['u_4','E','R_1','i_1','R_3','i_3']];
const KIR=[
 {nom:'Loi des nœuds', c:[numerique(9,T1,[1,1,2,2],null,NOEUDS1),numerique(24,T1,[2,2,4,1],{i_3:-1},NOEUDS1),numerique(20,T1,[1,2,3,3],{i_2:-1},NOEUDS1),
   numerique(24,T2,[1,2,2,8,3,1],null,NOEUDS2),numerique(30,T2,[2,4,2,5,4,6],{i_4:-1},NOEUDS2)]},
 {nom:'Loi des mailles', c:[numerique(10,T1,[1,2,5,1],null,MAILLES1),numerique(18,T1,[3,2,4,2],{u_3:-1},MAILLES1),numerique(24,T1,[2,2,4,1],{u_1:-1},MAILLES1)]},
 {nom:'Loi d\u2019Ohm et pont diviseur', c:[pontSerie([1,1]),pontSerie([1,2]),pontSerie([2,1]),pontSerie([1,3]),pontSerie([3,1]),pontSerie([1,1,1]),pontSerie([1,2,1]),pontSerie([2,1,1]),pontSerie([1,1,2])]},
 {nom:'Mailles, nœuds et loi d\u2019Ohm', c:[numerique(15,T1,[3,6,2,1],null,OHM1,[1,3]),numerique(20,T1,[4,4,5,3],null,OHM1,[1,3]),numerique(18,T1,[2,2,6,2],null,OHM1,[1,3])]},
 {nom:'Circuit à deux mailles', c:[deuxMailles(1,1,1),deuxMailles(1,2,2),deuxMailles(2,1,1),deuxMailles(1,2,1)]}
];

/* dipôle AB : suite de résistances horizontales ('h'), verticales ('v') et de fils verticaux ('f') */
function echelle(...seq){
  const e=[P([0,1],[0,0])], bas=[]; let x=0.5, n=0, prev=[0,0];
  seq.forEach((it,j)=>{ const [k,v]=it;
    if(k==='h'){ if(prev[0]<x) e.push(W(prev,[x,0])); e.push(R('R'+(++n),[x,0],[x+1.1,0],v)); x+=1.1; prev=[x,0]; return; }
    if(j>0 && seq[j-1][0]!=='h') x+=0.9;
    if(prev[0]<x) e.push(W(prev,[x,0])); prev=[x,0];
    e.push(k==='v'? R('R'+(++n),[x,0],[x,1],v) : W([x,0],[x,1])); bas.push(x);
  });
  e.push(W(...bas.sort((a,b)=>b-a).map(x=>[x,1]),[0,1]));
  return {t:'req',e,q:[{n:'R_éq',e:'AB',t:'r',d:1}]};
}
const h=v=>['h',v], v=v=>['v',v], f=['f'];
const REQ=[
 {nom:'En série', c:[echelle(h(1),v(1)),echelle(h(1),v(2)),echelle(h(2),v(2)),echelle(h(1),v(3)),echelle(h(2),v(3)),
   echelle(h(1),h(1),v(1)),echelle(h(1),h(2),v(1)),echelle(h(2),h(1),v(2)),echelle(h(1),h(1),v(2)),echelle(h(1),h(2),v(3))]},
 {nom:'En parallèle', c:[echelle(v(1),v(1)),echelle(v(1),v(2)),echelle(v(2),v(2)),echelle(v(1),v(3)),echelle(v(2),v(3)),echelle(v(3),v(3)),
   echelle(v(1),v(1),v(1)),echelle(v(2),v(2),v(1)),echelle(v(1),v(1),v(2)),echelle(v(2),v(2),v(2)),echelle(v(3),v(3),v(3))]},
 {nom:'Série puis parallèle', c:[echelle(h(1),v(1),v(1)),echelle(h(1),v(2),v(2)),echelle(h(2),v(1),v(1)),echelle(h(1),v(1),v(2)),echelle(h(2),v(2),v(2)),
   echelle(h(1),v(3),v(3)),echelle(h(2),v(1),v(2)),echelle(h(3),v(2),v(2)),echelle(h(1),v(2),v(1)),echelle(h(2),v(3),v(3))]},
 {nom:'Branches en parallèle', c:[echelle(v(1),h(1),v(1)),echelle(v(2),h(1),v(1)),echelle(v(1),h(1),v(2)),echelle(v(3),h(1),v(2)),echelle(v(2),h(2),v(2)),
   echelle(v(3),h(2),v(1)),echelle(v(1),h(2),v(2)),echelle(v(2),h(1),v(3)),echelle(v(3),h(1),v(1)),
   echelle(h(1),v(2),h(1),v(1)),echelle(h(1),v(1),h(1),v(1)),echelle(h(2),v(3),h(1),v(2))]},
 {nom:'Réseaux et pièges', c:[echelle(h(1),v(2),h(1),v(2),h(1),v(1)),echelle(h(1),v(1),h(1),v(1),h(1),v(1)),echelle(h(2),v(2),h(1),v(2),h(1),v(1)),echelle(h(1),v(3),h(1),v(2),h(1),v(1)),

/* =====================================================================
   2. RÉSOLUTION (analyse nodale modifiée)
   ===================================================================== */
const cle=p=>Math.round(p[0]*100)+','+Math.round(p[1]*100);
function resoudre(c,mode,etat){
  const par={}, trouve=x=>{ if(par[x]===undefined) par[x]=x; return par[x]===x?x:(par[x]=trouve(par[x])); };
  const uni=(a,b)=>{ par[trouve(cle(a))]=trouve(cle(b)); };
  const avant=mode==='m';
  for(const e of c.e){
    if(e.k==='W'){ for(let j=1;j<e.p.length;j++) uni(e.p[j-1],e.p[j]); }
    else if(e.k==='S'){ trouve(cle(e.p1)); trouve(cle(e.p2)); uni(e.c, avant?e.p1:e.p2); }
    else { trouve(cle(e.a)); trouve(cle(e.b));
      if(e.k==='K'){ const ferme=(c.t==='ferme')!==avant; if(ferme) uni(e.a,e.b); } }
  }
  const idx={}; let n=0;
  for(const x in par){ const r=trouve(x); if(idx[r]===undefined) idx[r]=n++; }
  const nd=p=>idx[trouve(cle(p))];
  const src=[];
  for(const e of c.e){
    if(e.k==='V'||e.k==='P') src.push([e,-e.v]);
    else if(e.k==='C' && mode==='p') src.push([e,etat[e.id].v]);
    else if(e.k==='L' && mode!=='p') src.push([e,0]);
  }
  const N=n+src.length, A=[], z=new Array(N).fill(0);
  for(let i=0;i<N;i++){ A.push(new Array(N).fill(0)); if(i<n) A[i][i]=1e-9; }
  for(const e of c.e){
    if(e.k==='R'||e.k==='D'){ const a=nd(e.a),b=nd(e.b),g=1/(e.r||e.v); A[a][a]+=g;A[b][b]+=g;A[a][b]-=g;A[b][a]-=g; }
    if(e.k==='L' && mode==='p'){ const i0=etat[e.id].i; z[nd(e.a)]-=i0; z[nd(e.b)]+=i0; }
  }
  src.forEach(([e,v],j)=>{ const k=n+j,a=nd(e.a),b=nd(e.b); A[a][k]+=1;A[b][k]-=1;A[k][a]+=1;A[k][b]-=1;z[k]=v; });
  for(let i=0;i<N;i++){
    let p=i; for(let r=i+1;r<N;r++) if(Math.abs(A[r][i])>Math.abs(A[p][i])) p=r;
    [A[i],A[p]]=[A[p],A[i]]; [z[i],z[p]]=[z[p],z[i]];
    for(let r=0;r<N;r++) if(r!==i){ const f=A[r][i]/A[i][i]; if(f){ for(let k=i;k<N;k++) A[r][k]-=f*A[i][k]; z[r]-=f*z[i]; } }
  }
  const x=z.map((v,i)=>v/A[i][i]), res={};
  for(const e of c.e){
    if(!e.id) continue;
    const v=x[nd(e.a)]-x[nd(e.b)], j=src.findIndex(s=>s[0]===e);
    res[e.id]={v, i: (e.k==='R'||e.k==='D')? v/(e.r||e.v) : j>=0? x[n+j] : (e.k==='L'? etat[e.id].i : 0)};
  }
  return res;
}
function analyser(c){
  if(c.sol) return c.sol;
  const m=resoudre(c,'m');
  if(c.dech) for(const e of c.e) if(e.k==='C') m[e.id]={v:0,i:0};   // condensateur initialement déchargé
  const p=resoudre(c,'p',m), inf=resoudre(c,'inf');

}
const valeur=(c,q,inst)=>{ const s=analyser(c)[inst]; let x;
  if(q.t==='r') x=1/Math.abs(s.AB.i); else { const r=s[q.e]; x=q.d*(q.t==='u'?r.v:r.i); }
  const f=fraction(x); return f? f[0]/f[1] : x; };

/* =====================================================================
   3. ÉCRITURE DES GRANDEURS ET DES RÉSULTATS
   ===================================================================== */
function fraction(x){
  for(let d=1;d<=12;d++){ const n=x*d; if(Math.abs(n-Math.round(n))<1e-5) return [Math.round(n),d]; }
  return null;
}
/* résultat littéral : tension en E, courant en E/R */
function ecrire(x,t,c){
  if(c&&c.num){ const y=Math.round(x*1000)/1000; return (y<0?'−':'')+String(Math.abs(y)).replace('.',',')+'\u00a0'+(t==='u'?'V':'A'); }
  const [n,d]=fraction(x); if(n===0) return '0';
  const s=n<0?'−':'', a=Math.abs(n);
  if(t==='r'){ const num=(a===1?'':a)+'<i>R</i>'; return d===1? num : '<span class="frac"><span>'+num+'</span><span>'+d+'</span></span>'; }
  const num=(a===1?'':a)+'<i>E</i>';
  if(t==='u') return d===1? s+num : s+'<span class="frac"><span>'+num+'</span><span>'+d+'</span></span>';
  return s+'<span class="frac"><span>'+num+'</span><span>'+(d===1?'':d)+'<i>R</i></span></span>';
}
const nomHTML=n=>{ const [a,b]=n.split('_'); return '<i>'+a+'</i>'+(b?'<sub>'+(/^[A-Za-z]$/.test(b)?'<i>'+b+'</i>':b)+'</sub>':''); };
const INST={m:'0<sup>−</sup>',p:'0<sup>+</sup>'};
const grandeur=(q,inst)=> inst==='inf'? nomHTML(q.n) : nomHTML(q.n)+'('+INST[inst]+')';

function enonce(c,item){
  if(c.t==='req') return 'Exprimer la résistance équivalente <i>R</i><sub>éq</sub> du dipôle AB en fonction de <i>R</i>.';
  if(c.num){ const l=[]; if(item.dE) l.push('<i>E</i> = '+ecrire(c.e.find(e=>e.k==='V').v,'u',c));
    item.dR.forEach(e=>l.push(nomHTML(e.nom)+' = '+e.v+'\u00a0Ω')); item.don.forEach(g=>l.push(nomHTML(g.n)+' = '+ecrire(valeur(c,g,'inf'),g.t,c)));
    return 'On donne : '+l.join(' ; ')+'.'; }
  if(c.t==='dc') return 'Exprimer la grandeur demandée en fonction de <i>E</i> et <i>R</i>.';
  if(c.t==='bascule') return 'K est en position (1) depuis très longtemps. À <i>t</i> = 0, on bascule K en position (2).';
  if(c.t==='ouvre') return 'L’interrupteur K est fermé depuis très longtemps. À <i>t</i> = 0, on ouvre K.';
  return (c.dech?'Le condensateur est initialement déchargé. ':'L’interrupteur K est ouvert depuis très longtemps. ')+'À <i>t</i> = 0, on ferme K.';
}
/* grandeurs continues du circuit (u_C, i_L) */
function continues(c){
  return c.e.filter(e=>e.k==='C'||e.k==='L').map(e=>c.q.find(q=>q.e===e.id && q.t===(e.k==='C'?'u':'i')));
}
function explication(c,q,inst,exo){
  const el=c.e.find(e=>e.id===q.e), val=ecrire(valeur(c,q,inst),q.t,c);
  const aC=c.e.some(e=>e.k==='C'), aL=c.e.some(e=>e.k==='L');
  if(inst==='p'){
    const propre=(el.k==='C'&&q.t==='u')||(el.k==='L'&&q.t==='i');
    if(propre) return (el.k==='C'?'La tension aux bornes d’un condensateur':'L’intensité du courant dans une bobine')+' est <b>continue</b> : '
      +grandeur(q,'p')+' = '+grandeur(q,'m')+' = '+val+'.';
    const ci=continues(c).map(k=>grandeur(k,'p')+' = '+ecrire(valeur(c,k,'p'),k.t,c)).join(' et ');
    return 'Par continuité, '+ci+'. La loi des mailles et la loi des nœuds à <i>t</i> = 0<sup>+</sup> donnent alors '+grandeur(q,'p')+' = '+val+'.';
  }
  const eq=[aC?'le condensateur se comporte comme un <b>interrupteur ouvert</b>':'',aL?'la bobine comme un <b>fil</b>':''].filter(Boolean).join(' et ')
    .replace(/^la bobine comme/,'la bobine se comporte comme');
  return 'En régime permanent, '+eq+' : '+(inst==='m'?grandeur(q,'m'):'quand <i>t</i> → ∞, '+nomHTML(q.n))+' = '+val+'.';
}

/* =====================================================================
   3 bis. JUSTIFICATION DÉTAILLÉE
   On construit le réseau à l'instant voulu (branches, nœuds, mailles), puis on
   cherche le plus petit jeu de lois (mailles / nœuds) qui, avec ce que l'on sait
   (continuité à 0+, équivalents en régime permanent), détermine la grandeur.
   ===================================================================== */
const rang=M0=>{ const M=M0.map(r=>r.slice()); let r=0;
  for(let c=0;c<M[0].length&&r<M.length;c++){ let p=r;
    for(let i=r+1;i<M.length;i++) if(Math.abs(M[i][c])>Math.abs(M[p][c])) p=i;
    if(Math.abs(M[p][c])<1e-9) continue; [M[r],M[p]]=[M[p],M[r]];
    for(let i=r+1;i<M.length;i++){ const f=M[i][c]/M[r][c]; for(let k=c;k<M[0].length;k++) M[i][k]-=f*M[r][k]; }
    r++; } return r; };
const somme=l=> l.length? l.map((t,j)=>(j? (t.s<0?' − ':' + ') : (t.s<0?'−':''))+t.h).join('') : '0';
const egal=l=>{ let g=l.filter(t=>t.s>0), d=l.filter(t=>t.s<0).map(t=>({s:1,h:t.h})); if(!g.length){ g=d; d=[]; } return somme(g)+' = '+somme(d); };
const rLabel=e=> e.nom? nomHTML(e.nom) : (e.v===1?'':e.v)+'<i>R</i>';

function reseau(c,inst,don){
  const avant=inst==='m', par={};
  const tr=x=>{ if(par[x]===undefined) par[x]=x; return par[x]===x?x:(par[x]=tr(par[x])); };
  const uni=(a,b)=>{ par[tr(cle(a))]=tr(cle(b)); };
  for(const e of c.e){
    if(e.k==='W') for(let j=1;j<e.p.length;j++) uni(e.p[j-1],e.p[j]);
    else if(e.k==='S') uni(e.c,avant?e.p1:e.p2);
    else if(e.k==='K' && (c.t==='ferme')!==avant) uni(e.a,e.b);
  }
  const ar=c.e.filter(e=>e.id).map(e=>({e,na:tr(cle(e.a)),nb:tr(cle(e.b))})), pend=new Set();
  let deg;
  for(;;){ deg={}; ar.forEach(x=>{ deg[x.na]=(deg[x.na]||0)+1; deg[x.nb]=(deg[x.nb]||0)+1; });
    const k=ar.findIndex(x=>deg[x.na]===1||deg[x.nb]===1); if(k<0) break; pend.add(ar[k].e.id); ar.splice(k,1); }
  /* branches */
  const br=[], vu=new Set(), autre=(n,x)=>ar.find(y=>y!==x&&(y.na===n||y.nb===n));
  for(const x of ar){ if(vu.has(x)) continue;
    const ch=[{x,s:1}]; vu.add(x); let tete=x.nb, queue=x.na;
    while(deg[tete]===2 && tete!==queue){ const y=autre(tete,ch[ch.length-1].x); if(!y||vu.has(y)) break; const s=y.na===tete?1:-1; ch.push({x:y,s}); vu.add(y); tete=s>0?y.nb:y.na; }
    while(deg[queue]===2 && tete!==queue){ const y=autre(queue,ch[0].x); if(!y||vu.has(y)) break; const s=y.nb===queue?1:-1; ch.unshift({x:y,s}); vu.add(y); queue=s>0?y.na:y.nb; }

  let N=br.length; const uvar={};
  br.forEach((b,i)=>{ b.i=i; b.ch.forEach(o=>{ o.x.b=b; o.x.s=o.s; });
    let q=null,sg=1;
    for(const o of b.ch.filter(o=>o.x.e.k==='L').concat(b.ch)){ const k=c.q.find(k=>k.t==='i'&&k.e===o.x.e.id); if(k){ q=k; sg=k.d*o.s; break; } }
    if(!q){ const o=['R','L','C','V'].map(k=>b.ch.find(o=>o.x.e.k===k)).find(Boolean); q={n:libres.shift()||'i_9',e:o.x.e.id,t:'i',d:1}; sg=o.s; }
    b.q=q; b.sg=sg; });
  ar.forEach(x=>{ if(x.e.k==='C'||x.e.k==='L'||x.e.k==='D'){ uvar[x.e.id]=N++; x.qu=c.q.find(k=>k.t==='u'&&k.e===x.e.id)||{n:'u',e:x.e.id,t:'u',d:1}; } });
  /* ce que l'on sait */
  const sol=analyser(c)[inst], faits=[];
  for(const x of ar){ const e=x.e;
    if(e.k==='C') faits.push(inst==='p'? {v:uvar[e.id],val:sol[e.id].v,x,cont:1} : {v:x.b.i,val:0,x});
    if(e.k==='L') faits.push(inst==='p'? {v:x.b.i,val:x.s*sol[e.id].i,x,cont:1} : {v:uvar[e.id],val:0,x});
  }
  for(const g of don||[]){ const x=ar.find(y=>y.e.id===g.e); if(!x) continue;
    if(g.t==='i') faits.push({v:x.b.i,val:x.s*sol[g.e].i,x,don:g});
    else if(uvar[g.e]!==undefined) faits.push({v:uvar[g.e],val:sol[g.e].v,x,don:g}); }

    const co=new Array(N).fill(0); br.forEach(b=>{ if(b.n1===n) co[b.i]+=1; if(b.n2===n) co[b.i]-=1; });
    if(lois.some(l=>l.co.every((v,j)=>v===co[j])||l.co.every((v,j)=>v===-co[j]))) continue;

      else if(b.n2===cur){ chemin.push({b,d:-1}); dfs(b0,b.n1,chemin); chemin.pop(); } } };

function justifier(c,q,inst,don){
  if(q.t==='r') return reduire(c);
  const r=reseau(c,inst,don), el=c.e.find(e=>e.id===q.e), val=ecrire(valeur(c,q,inst),q.t,c);
  const titre= inst==='p'? 'À <i>t</i> = 0<sup>+</sup>' : inst==='m'? 'À <i>t</i> = 0<sup>−</sup> (régime permanent)' : 'Régime permanent, quand <i>t</i> → ∞';
  const fin=grandeur(q,inst)+' = '+val;
  if(r.pend.has(q.e)){
    if(el.k==='R') return {qs:[],fin,et:['<b>'+titre+'</b> : la branche de cette résistance est ouverte, aucun courant ne la traverse'+(q.t==='u'?' ; d’après la loi d’Ohm, la tension à ses bornes est nulle':'')]};
    if(el.k==='L'&&q.t==='i') return {qs:[],fin,et:['<b>'+titre+'</b> : le circuit de la bobine est ouvert, aucun courant ne la traverse']};
    if(el.k==='C'&&q.t==='u'&&c.dech) return {qs:[],fin,et:['<b>'+titre+'</b> : le condensateur est déchargé (énoncé)']};

  r.ar.forEach(y=>{ if(r.uvar[y.e.id]!==undefined) xv[r.uvar[y.e.id]]=r.sol[y.e.id].v; });
  const qs=new Set(), et=[], nomI=b=>{ qs.add(b.q); return nomHTML(b.q.n); }, nomU=y=>{ qs.add(y.qu); return nomHTML(y.qu.n); };
  const direct= q.t==='u' && el.k==='R' && S.length>0 && S.every(l=>l.t==='m') && x.b.ch.filter(o=>o.x.e.k==='R').length===1;
  const utiles=r.faits.filter(f=> f.v===tv || S.some(l=>Math.abs(l.co[f.v])>1e-9));
  for(const f of utiles){ const e=f.x.e;
    if(!f.cont) continue;
    const C_=e.k==='C', qe= C_? f.x.qu : (c.q.find(k=>k.t==='i'&&k.e===e.id)||f.x.b.q), v=valeur(c,qe,'p');
    const av=justifier(c,qe,'m');                                   // d'où vient la valeur à 0- ?
    if(av){ et.push({sous:1,h:av.et.join(' ; ')+(av.seul?'':' ⟹ '+av.fin)}); av.qs.forEach(k=>{ if(c.q.includes(k)) qs.add(k); }); }
    qs.add(qe);
    et.push('<b>Continuité '+(C_?'de la tension aux bornes du condensateur':'du courant dans la bobine')+'</b> : '+grandeur(qe,'p')+' = '+grandeur(qe,'m')+' = '+ecrire(v,qe.t,c));

  }
  if(c.num){ const dn=[];
    if(S.some(l=>l.k)) dn.push('<i>E</i> = '+ecrire(c.e.find(e=>e.k==='V').v,'u',c));
    const rs=new Set(); S.forEach(l=>(l.tm||[]).forEach(t=>{ if(!t.u) rs.add(t.x.e); })); if(q.t==='u'&&el.k==='R') rs.add(el);
    rs.forEach(e=>dn.push(nomHTML(e.nom)+' = '+e.v+'\u00a0Ω'));

    r.ar.forEach(y=>{ const k=r.uvar[y.e.id]; if(k!==undefined && k!==tv && !utiles.some(f=>f.v===k) && S.some(l=>Math.abs(l.co[k])>1e-9)) inter.push(nomU(y)+' = '+ecrire(y.qu.d*xv[k],'u',c)); });
    if(inter.length) et.push('<b>On résout</b> : '+inter.join(', '));

    et.push('<b>Loi d’Ohm</b> : '+nomHTML(q.n)+' = '+(q.d*x.s*x.b.sg<0?'−':'')+rLabel(el)+' '+nomI(x.b));

/* résistance équivalente : réductions successives série / parallèle */
function reduire(c){
  const par={}, tr=x=>{ if(par[x]===undefined) par[x]=x; return par[x]===x?x:(par[x]=tr(par[x])); };
  for(const e of c.e) if(e.k==='W') for(let j=1;j<e.p.length;j++) par[tr(cle(e.p[j-1]))]=tr(cle(e.p[j]));
  const pt=c.e.find(e=>e.k==='P'), A=tr(cle(pt.a)), B=tr(cle(pt.b)), f=v=>ecrire(v,'r'), et=[];
  let ar=c.e.filter(e=>e.k==='R').map(e=>({a:tr(cle(e.a)),b:tr(cle(e.b)),v:e.v}));
  for(let garde=0;garde<30;garde++){
    const cc=ar.find(x=>x.a===x.b);
    if(cc){ et.push('<b>Court-circuit</b> : la résistance '+f(cc.v)+' est en parallèle avec un fil, aucun courant ne la traverse ; on la retire'); ar=ar.filter(x=>x!==cc); continue; }
    const deg={}; ar.forEach(x=>{ deg[x.a]=(deg[x.a]||0)+1; deg[x.b]=(deg[x.b]||0)+1; });
    const n=Object.keys(deg).find(k=>deg[k]===2&&k!==A&&k!==B);
    if(n){ const [x,y]=ar.filter(z=>z.a===n||z.b===n), v=x.v+y.v;
      et.push('<b>En série</b> : '+f(x.v)+' + '+f(y.v)+' = '+f(v));
      ar=ar.filter(z=>z!==x&&z!==y).concat([{a:x.a===n?x.b:x.a,b:y.a===n?y.b:y.a,v}]); continue; }
    let p=null; for(const x of ar){ const y=ar.find(z=>z!==x&&((z.a===x.a&&z.b===x.b)||(z.a===x.b&&z.b===x.a))); if(y){ p=[x,y]; break; } }
    if(p){ const [x,y]=p, v=x.v*y.v/(x.v+y.v);
      et.push('<b>En parallèle</b> : <span class="frac"><span>'+f(x.v)+' × '+f(y.v)+'</span><span>'+f(x.v)+' + '+f(y.v)+'</span></span> = '+f(v));
      ar=ar.filter(z=>z!==x&&z!==y).concat([{a:x.a,b:x.b,v}]); continue; }
    break;
  }
  if(ar.length!==1) return null;
  return {et,fin:'<i>R</i><sub>éq</sub> = '+f(ar[0].v),qs:[],lois:[],val:ar[0].v};
}
function preuve(c,q,inst,don){
  const J=justifier(c,q,inst,don); if(!J) return null;
  J.h=J.et.map(e=> typeof e==='string'? '<span class="etape">'+e+'.</span>' : '<span class="etape sous">'+e.h+'.</span>').join('')
     +(J.seul?'':'<span class="etape res">⟹ '+J.fin+'</span>');
  return J;
}

const UN=100, DEMI={R:22,D:22,L:24,C:5,V:18,K:14};
function etiq(n,x,y,anc,cls){
  const m=n.match(/^(\d*)([A-Za-z]*)(?:_(.+))?$/); let s='';
  if(!m) return '<text class="txt '+(cls||'')+'" x="'+x+'" y="'+y+'" text-anchor="'+anc+'">'+n+'</text>';
  if(m[1]) s+=m[1];
  s+='<tspan font-style="italic">'+m[2]+'</tspan>';
  if(m[3]) s+='<tspan dy="5" font-size="14"'+(/\d/.test(m[3])?'':' font-style="italic"')+'>'+m[3]+'</tspan>';
  return '<text class="txt '+(cls||'')+'" x="'+x+'" y="'+y+'" text-anchor="'+anc+'">'+s+'</text>';
}
const tete=(x,y,dx,dy,cls,t=6)=>{ // pointe de flèche en (x,y), dirigée selon (dx,dy)
  const bx=x-dx*12, by=y-dy*12;
  return '<path class="'+cls+'" stroke="none" d="M'+x+' '+y+' L'+(bx-dy*t)+' '+(by+dx*t)+' L'+(bx+dy*t)+' '+(by-dx*t)+' Z"/>';
};
function dessiner(c,q){
  const X=p=>p[0]*UN, Y=p=>p[1]*UN; let s='', pts=[], compte={};
  const QS=!q?[]:Array.isArray(q)?q:[q];
  const vu=p=>{ pts.push(p); const k=cle(p); compte[k]=(compte[k]||0)+1; };
  for(const e of c.e){
    if(e.k==='W'){
      s+='<path class="fil" d="M'+e.p.map(p=>X(p)+' '+Y(p)).join(' L')+'"/>';
      e.p.forEach((p,j)=>{ vu(p); if(j>0&&j<e.p.length-1) vu(p); });
      continue;
    }
    if(e.k==='S'){
      const [cx,cy]=[X(e.c),Y(e.c)], a1=Math.atan2(Y(e.p1)-cy,X(e.p1)-cx), a2=Math.atan2(Y(e.p2)-cy,X(e.p2)-cx);
      let d=a2-a1; if(d>Math.PI) d-=2*Math.PI; if(d<-Math.PI) d+=2*Math.PI;
      const am=a1+d*0.5, r=44, pol=(a,ro)=>(cx+ro*Math.cos(a)).toFixed(1)+' '+(cy+ro*Math.sin(a)).toFixed(1);
      s+='<path class="fil" stroke-width="2.6" d="M'+cx+' '+cy+' L'+pol(am,52)+'"/>';
      s+='<path class="fil" stroke-width="1.2" d="M'+pol(a1+d*0.12,r)+' A'+r+' '+r+' 0 0 '+(d<0?1:0)+' '+pol(a1+d*0.9,r)+'"/>';
      for(const p of [e.c,e.p1,e.p2]) s+='<circle class="cmp" cx="'+X(p)+'" cy="'+Y(p)+'" r="4"/>';
      s+=etiq('K',cx+4,cy-14,'middle')+'<text class="txt" font-size="16" x="'+(X(e.p1)-4)+'" y="'+(Y(e.p1)-10)+'" text-anchor="middle">(1)</text>'
        +'<text class="txt" font-size="16" x="'+(X(e.p2)-10)+'" y="'+(Y(e.p2)+3)+'" text-anchor="end">(2)</text>';
      [e.c,e.p1,e.p2].forEach(vu); continue;
    }
    if(e.k==='P'){
      for(const [p,n] of [[e.b,'A'],[e.a,'B']]){ vu(p); s+='<circle class="cmp" cx="'+X(p)+'" cy="'+Y(p)+'" r="5"/>'+etiq(n,X(p)-14,Y(p)+7,'end'); }
      continue;
    }
    const hor=Math.abs(e.a[1]-e.b[1])<1e-6, xa=X(e.a),ya=Y(e.a),xb=X(e.b),yb=Y(e.b);
    const mx=(xa+xb)/2,my=(ya+yb)/2, len=Math.hypot(xb-xa,yb-ya), dx=(xb-xa)/len, dy=(yb-ya)/len, h=DEMI[e.k];
    vu(e.a); vu(e.b);
    s+='<path class="fil" d="M'+xa+' '+ya+' L'+(mx-dx*h)+' '+(my-dy*h)+' M'+(mx+dx*h)+' '+(my+dy*h)+' L'+xb+' '+yb+'"/>';
    const rot='transform="translate('+mx+' '+my+') rotate('+(Math.atan2(dy,dx)*180/Math.PI)+')"';
    let nom='';
    if(e.k==='R'){ s+='<rect class="cmp" x="-22" y="-9" width="44" height="18" '+rot+'/>'; nom=e.nom||(e.v===1?'':e.v)+'R'; }
    if(e.k==='D'){ s+='<rect class="cmp" x="-22" y="-11" width="44" height="22" rx="6" '+rot+'/>'; nom=e.nom; }
    if(e.k==='C'){ s+='<path stroke="#111" stroke-width="4" d="M-5 -19 L-5 19 M5 -19 L5 19" '+rot+'/>'; nom='C'; }
    if(e.k==='L'){ s+='<path class="fil" d="M-24 0 a6 6 0 0 1 12 0 a6 6 0 0 1 12 0 a6 6 0 0 1 12 0 a6 6 0 0 1 12 0" '+rot+'/>'; nom='L'; }
    if(e.k==='V'){ s+='<g '+rot+'><circle class="cmp" r="18"/><path class="fil" d="M-18 0 L18 0"/></g>';
      const ox=hor?0:-36, oy=hor?36:0;
      s+='<path class="fil" stroke-width="1.5" d="M'+(mx+ox-dx*16)+' '+(my+oy-dy*16)+' L'+(mx+ox+dx*10)+' '+(my+oy+dy*10)+'"/>'+tete(mx+ox+dx*20,my+oy+dy*20,dx,dy,'')
        +etiq('E',mx+ox-(hor?0:12),my+oy+(hor?24:6),hor?'middle':'end'); }
    if(e.k==='K'){
      const ferme=c.t==='ouvre';
      s+='<g '+rot+'><path class="fil" stroke-width="2.6" d="'+(ferme?'M-12 0 L12 0':'M-12 0 L11 -13')+'"/><circle class="cmp" cx="-14" cy="0" r="3.5"/><circle class="cmp" cx="14" cy="0" r="3.5"/></g>';
      s+=etiq('K',mx,my-(ferme?12:20),'middle');
    }
    if(nom) s+= hor? etiq(nom,mx,my-(e.k==='C'?26:16),'middle') : etiq(nom,mx-(e.k==='C'?26:e.k==='L'?10:16),my+6,'end');
    for(const q of QS) if(q.e===e.id){
      const cl= q===QS[0]?'ask':'aux';
      if(q.t==='i'){               // flèche sur le fil d'arrivée, dirigée vers le dipôle

      }else{                       // flèche de tension le long du dipôle, pointe vers a si d = 1

        s+='<path class="fil '+cl+'" stroke-width="1.8" d="M'+(mx+ox-sg*dx*g)+' '+(my+oy-sg*dy*g)+' L'+(mx+ox+sg*dx*(g-8))+' '+(my+oy+sg*dy*(g-8))+'"/>'
          +tete(mx+ox+sg*dx*g,my+oy+sg*dy*g,sg*dx,sg*dy,cl);
        s+= hor? etiq(q.n,mx-g-8,my+oy+6,'end',cl) : etiq(q.n,mx+ox+10,my+6,'start',cl);
      }
    }
  }
  for(const k in compte) if(compte[k]>=3){ const [x,y]=k.split(',').map(Number); s+='<circle cx="'+x+'" cy="'+y+'" r="4" fill="#111"/>'; }
  const xs=pts.map(X), ys=pts.map(Y), x0=Math.min(...xs)-64, x1=Math.max(...xs)+78, y0=Math.min(...ys)-42, y1=Math.max(...ys)+34;
  const w=x1-x0, hh=y1-y0;
  return '<svg viewBox="'+x0+' '+y0+' '+w+' '+hh+'" style="max-width:'+Math.round(w*0.95)+'px" xmlns="http://www.w3.org/2000/svg" role="img">'+s+'</svg>';
}

const melange=a=>{ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
function vivier(exo,niv){
  const out=[];
  niv.c.forEach((c,ic)=>{
    if(c.sp){ out.push({c,ic,q:{n:'',t:'x'},inst:'inf'}); return; }
    if(c.enig){ c.enig.forEach(g=>out.push(Object.assign({c,ic,inst:'inf'},g))); return; }
    const insts= exo==='ci'? ['p'] : (c.i2||['inf']);
    for(const inst of insts) for(const q of c.q) out.push({c,ic,q,inst});
  });
  return out;
}
function tirage(exo,niv){
  const t=melange(vivier(exo,niv)).slice(0,5);
  const ordre=[...new Set(t.map(x=>x.ic))];
  return t.sort((a,b)=>ordre.indexOf(a.ic)-ordre.indexOf(b.ic));
}
function choix(item){
  const {c,q,inst}=item, bon=valeur(c,q,inst), liste=[bon];
  const ajoute=v=>{ if(liste.length<4 && isFinite(v) && fraction(v) && !liste.some(x=>Math.abs(x-v)<1e-5)) liste.push(v); };
  if(q.t==='r'){                                   // tout en série, tout en parallèle, puis valeurs voisines
    const rs=c.e.filter(e=>e.k==='R').map(e=>e.v);
    for(const v of melange([rs.reduce((a,b)=>a+b,0), 1/rs.reduce((a,b)=>a+1/b,0)])) ajoute(v);
    for(const v of melange([0.5,1,1.5,2,2/3,3,2.5,4/3,1/3,4,0.75,5/3,1.2])) ajoute(v);
  }else if(c.num){                                 // erreurs de signe dans la loi utilisée
    const g=item.don.filter(d=>d.t===q.t).map(d=>valeur(c,d,inst)); if(item.dE&&q.t==='u') g.push(c.e.find(e=>e.k==='V').v);
    const cand=[-bon]; for(const a of g) for(const b of g) if(a!==b||g.length===1) cand.push(a+b,a-b,-a-b);
    cand.push(g.reduce((a,b)=>a+b,0));
    for(const v of melange(cand)) if(Math.abs(v)>1e-9) ajoute(v);
    for(const v of melange([bon+1,bon-1,bon+2,bon-2,bon+3])) if(Math.abs(v)>1e-9) ajoute(v);
  }else{
    for(const o of melange(['m','p','inf'].filter(x=>x!==inst))) ajoute(valeur(c,q,o));   // confusion d'instant
    if(Math.abs(bon)>1e-5) ajoute(-bon);                                                    // erreur de signe
    for(const o of melange(c.q.filter(x=>x.t===q.t && x!==q))) ajoute(valeur(c,o,inst));  // autre grandeur
    for(const v of melange([0,1,-1,0.5,2,-0.5,1/3,2/3])) ajoute(v);
  }
  return {bon,liste:melange(liste)};
}

const FR=(a,b)=>'<span class="frac"><span>'+a+'</span><span>'+b+'</span></span>';

/* ---------- M1 : projection d'un vecteur sur (Ox, Oy) ---------- */

    let da=a1-a0; if(da>Math.PI) da-=2*Math.PI; if(da<-Math.PI) da+=2*Math.PI;

    else{ const F=[M[0]+L*sx*cx*ex[0],M[1]+L*sx*cx*ex[1]], G=[M[0]+L*sy*cy*ey[0],M[1]+L*sy*cy*ey[1]];
      s+='<path class="fil" stroke-width="1.2" stroke-dasharray="5 5" d="M'+T+' L'+F+' M'+T+' L'+G+'"/>'; }
    s+='<path class="fil aux" stroke-width="1.6" d="M'+P(a0,38)+' A38 38 0 0 '+(da>0?1:0)+' '+P(a1,38)+'"/>';
    const la=P(a0+da/2,55).split(' ').map(Number); s+=etiq(o.ang,la[0],la[1]+6,'middle','aux');
    s+='<path class="fil ask" stroke-width="3" d="M'+M+' L'+(T[0]-v[0]*9)+' '+(T[1]-v[1]*9)+'"/>'+tete(T[0],T[1],v[0],v[1],'ask',6.5);
    const lx=T[0]+v[0]*20, ly=T[1]+v[1]*20+7;
    s+=etiq(o.nom,lx,ly,'middle','ask')+'<path class="fil ask" stroke-width="1.5" d="M'+(lx-7)+' '+(ly-18)+' L'+(lx+7)+' '+(ly-18)+' m-4 -3 l4 3 l-4 3"/>';

  };
  return {t:'proj',o,sp:{
    dessin,
    enonce:()=>'Le vecteur <span class="vec">'+V+'</span> a pour norme '+V+'. Il fait un angle '+A+' avec '+(o.dep?'la direction de ':'')+'l\u2019axe (O<i>'+o.ref+'</i>)'+(o.dep?' (pointillés)':'')+'.'+(o.xGauche||o.yBas||o.rot?' Attention à l\u2019orientation des axes.':''),
    question:()=>'<span class="q">'+comp+'</span><span>= ?</span>',
    reponse:()=>expr(signe,fct),

function compo(f){                                  // composition élémentaire d'une formule

async function appel(url,corps,opt){
  let r; const ctl=new AbortController(), minuterie=setTimeout(()=>ctl.abort(),12000);
  try{ r=await fetch(url,Object.assign({method:'POST',headers:{'Content-Type':'application/json'},body:corps?JSON.stringify(corps):undefined,signal:ctl.signal},opt)); }
  catch(e){ throw new Error('Pas de connexion à Internet.'); }
  finally{ clearTimeout(minuterie); }
  const j=await r.json().catch(()=>({}));
  if(!r.ok){ const m=((j.error&&j.error.message)||'').split(' ')[0]; const err=new Error(ERREURS[m]||'Erreur ('+(m||r.status)+').'); err.code=r.status; throw err; }
  return j;
}

    const p=deCarte(d.fields&&d.fields.prog), e=deCarte(d.fields&&d.fields.essais), x=deCarte(d.fields&&d.fields.echecs);
    for(const k in p) prog[k]=Math.max(prog[k]||0,p[k]);

let modeCreer=false;
function ecranConnexion(){
  $('cTitre').textContent=modeCreer?'Créer mon compte':'Se connecter';
  $('cNomL').style.display=modeCreer?'block':'none';
  $('cOk').textContent=modeCreer?'Créer mon compte':'Se connecter';
  $('cBascule').textContent=modeCreer?'J\u2019ai déjà un compte':'Première fois ? Créer un compte';
  $('cOubli').style.display=modeCreer?'none':'block';
  $('cMsg').textContent=''; $('cMsg').className='msg';
  montre('connexion');
}
const dit=(t,ok)=>{ $('cMsg').textContent=t; $('cMsg').className='msg '+(ok?'ok':'ko'); };
$('cBascule').addEventListener('click',()=>{ modeCreer=!modeCreer; ecranConnexion(); });
$('cForm').addEventListener('submit',async ev=>{
  ev.preventDefault();
  const email=$('cEmail').value.trim(), mdp=$('cMdp').value, nom=$('cNom').value.trim();
  if(modeCreer&&nom.length<3){ dit('Indiquer prénom et nom.'); return; }
  $('cOk').disabled=true; dit('Connexion…',true);
  try{ await connexion(modeCreer,email,mdp,nom); $('cMdp').value=''; accueil(); }
  catch(e){ dit(e.message); }
  $('cOk').disabled=false;
});
$('cOubli').addEventListener('click',async ()=>{
  const email=$('cEmail').value.trim(); if(!email){ dit('Saisir d\u2019abord l\u2019adresse e-mail.'); return; }
  try{ await motDePasseOublie(email); dit('Un e-mail de réinitialisation vient d\u2019être envoyé.',true); }catch(e){ dit(e.message); }
});
$('sortir').addEventListener('click',()=>{ deconnexion(); modeCreer=false; ecranConnexion(); });
$('suivi').addEventListener('click',suivi);
$('sRetour').addEventListener('click',accueil);
$('sMaj').addEventListener('click',suivi);
async function suivi(){
  montre('suiviE'); $('sTable').innerHTML='<p>Chargement…</p>';
  const exos=COMPETENCES.flatMap(c=>c.exos.map(e=>({cle:c.id+'.'+e.id,nom:c.code+' '+e.titre,n:e.niveaux.length})));
  try{
    const l=(await listeEleves()).filter(e=>e.id!==session.uid).sort((a,b)=>a.nom.localeCompare(b.nom));
    let h='<table><tr><th>Élève</th>'+exos.map(e=>'<th>'+e.nom+'</th>').join('')+'<th>Essais</th><th>Dernière activité</th></tr>';
    for(const e of l) h+='<tr><td class="g"><b>'+(e.nom||'—').replace(/</g,'&lt;')+'</b></td>'
      +exos.map(x=>{ const v=Math.min(e.prog[x.cle]||0,x.n); const ec=e.echecs[x.cle]||0; return '<td class="'+(v===x.n?'tout':v?'part':'')+'">'+v+'/'+x.n+'<small class="ec'+(ec?' oui':'')+'">'+ec+' échec'+(ec>1?'s':'')+'</small></td>'; }).join('')
      +'<td>'+Object.values(e.essais).reduce((a,b)=>a+b,0)+'</td><td>'+(e.maj? new Date(e.maj).toLocaleDateString('fr-FR') : '')+'</td></tr>';
    $('sTable').innerHTML= l.length? h+'</table><p class="note">'+l.length+' élève'+(l.length>1?'s':'')+'. Sous chaque score : nombre de niveaux perdus sur une erreur dans cet exercice. « Essais » = nombre total de niveaux lancés.</p>' : '<p>Aucun élève inscrit pour l\u2019instant.</p>';
  }catch(e){ $('sTable').innerHTML='<p>Impossible de lire les données : '+e.message+'</p>'; }
}

if(EN_LIGNE&&!session) ecranConnexion();
else{ accueil(); if(EN_LIGNE) recupere().then(ok=>{ if(ok===false){ deconnexion(); ecranConnexion(); } else { sauve(); accueil(); } }); }
</script>
</body>
